name: Deploy (Cloudflare)

# Gated: manual dispatch only, and only runs when the Cloudflare secrets are
# configured. No automatic production deploy. The Next.js app deploys to
# Cloudflare via @opennextjs/cloudflare; the Python LiveKit agent is NOT
# deployed here (it runs on a container, not Workers).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy to Cloudflare
    runs-on: ubuntu-latest
    # Only attempt when the account secret exists.
    if: ${{ vars.ENABLE_CLOUDFLARE_DEPLOY == 'true' }}
    environment: production
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build for Cloudflare
        run: bun run cf:build
        env:
          DATABASE_URL: postgresql://jobprep:jobprep@127.0.0.1:5432/jobprep
          BETTER_AUTH_SECRET: ci_dummy_secret_value_padding_padding_padding
          BETTER_AUTH_URL: https://jobprep.invalid
          NEXT_PUBLIC_APP_URL: https://jobprep.invalid
      - name: Deploy with OpenNext
        run: bun run cf:deploy -- --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
