name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  # Useful if you later enable GitHub merge queues.
  merge_group:

  # Allows manually running CI from GitHub when debugging infrastructure.
  workflow_dispatch:

# Cancel superseded CI runs for the same PR / branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Default to the minimum permissions required.
permissions:
  contents: read

env:
  CI: "true"
  NODE_OPTIONS: "--max-old-space-size=4096"

  # ---------------------------------------------------------------------------
  # Runtime versions
  # ---------------------------------------------------------------------------
  #
  # Keep these pinned.
  #
  # packageManager in package.json pins the developer baseline. The explicit
  # value below makes the CI runtime equally reproducible.
  # ---------------------------------------------------------------------------

  BUN_VERSION: "1.4.2"
  UV_VERSION: "0.12.15"

  # Disable framework / CLI telemetry in CI.
  NEXT_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"

  # ---------------------------------------------------------------------------
  # CI-only environment
  # ---------------------------------------------------------------------------
  #
  # These are fake values.
  #
  # Never put real production credentials here.
  #
  # CI should be capable of evaluating Prisma, Better Auth, Stripe, LiveKit,
  # and application configuration without requiring production secrets.
  # ---------------------------------------------------------------------------

  DATABASE_URL: postgresql://jobprep:jobprep@127.0.0.1:5432/jobprep
  POSTGRES_PRISMA_URL: postgresql://jobprep:jobprep@127.0.0.1:5432/jobprep
  DATABASE_URL_UNPOOLED: postgresql://jobprep:jobprep@127.0.0.1:5432/jobprep

  STRIPE_SECRET_KEY: sk_test_dummy
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_dummy
  STRIPE_WEBHOOK_SECRET: whsec_dummy

  BETTER_AUTH_SECRET: ci_dummy_secret_value_padding_padding_padding
  BETTER_AUTH_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000

  OPENAI_API_KEY: sk-dummy

  LIVEKIT_API_KEY: dummy
  LIVEKIT_API_SECRET: dummy
  NEXT_PUBLIC_LIVEKIT_URL: wss://dummy.livekit.cloud

  APP_NAME: JobPrep


jobs:
  # ===========================================================================
  # Lint + formatting + TypeScript
  # ===========================================================================

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # actions/checkout v7.0.1
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Show runtime versions
        run: |
          bun --version
          node --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      # -----------------------------------------------------------------------
      # Transitional lint strategy
      #
      # lint:strict:
      #   Modern / security-sensitive code.
      #   BLOCKING.
      #
      # lint:ci:
      #   Entire legacy repository.
      #   Advisory temporarily.
      #
      # Goal:
      #   Eventually remove lint:strict and make the full repository blocking.
      # -----------------------------------------------------------------------

      - name: Lint strict surface
        run: bun run lint:strict

      - name: Lint full repository
        run: bun run lint:ci
        continue-on-error: true

      - name: TypeScript type check
        run: bun run typecheck


  # ===========================================================================
  # Prisma / migrations
  #
  # Uses a real disposable PostgreSQL database.
  #
  # This catches:
  #
  #   - invalid Prisma schemas
  #   - broken migrations
  #   - migrations that cannot deploy cleanly
  #   - schema.prisma changes that were committed without migrations
  #
  # ===========================================================================

  database:
    name: Database & Prisma
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_USER: jobprep
          POSTGRES_DB: jobprep
          POSTGRES_HOST_AUTH_METHOD: trust

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U jobprep -d jobprep"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Prisma schema
        run: bunx prisma validate

      - name: Generate Prisma client
        run: bunx prisma generate

      # Apply exactly what exists in prisma/migrations.
      #
      # A completely clean DB is used, so a broken migration chain cannot hide.
      - name: Apply migrations to clean database
        run: bunx prisma migrate deploy

      - name: Check migration status
        run: bunx prisma migrate status

      # -----------------------------------------------------------------------
      # Detect:
      #
      # schema.prisma changed
      #       +
      # migration forgotten
      #
      # Prisma 7 removed --from-url in favor of
      # --from-config-datasource, so detect the installed major version.
      # -----------------------------------------------------------------------

      - name: Detect schema changes missing migrations
        shell: bash
        run: |
          set -euo pipefail

          PRISMA_MAJOR="$(
            bunx prisma -v \
              | sed -n 's/^prisma[[:space:]]*:[[:space:]]*\([0-9][0-9]*\).*/\1/p' \
              | head -n 1
          )"

          if [[ -z "$PRISMA_MAJOR" ]]; then
            echo "Unable to determine Prisma major version."
            bunx prisma -v
            exit 1
          fi

          echo "Detected Prisma major version: $PRISMA_MAJOR"

          if (( PRISMA_MAJOR >= 7 )); then
            bunx prisma migrate diff \
              --from-config-datasource \
              --to-schema prisma/schema.prisma \
              --exit-code
          else
            bunx prisma migrate diff \
              --from-url "$DATABASE_URL" \
              --to-schema-datamodel prisma/schema.prisma \
              --exit-code
          fi


  # ===========================================================================
  # Unit tests
  # ===========================================================================

  unit:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests with coverage
        run: bun run test:coverage

      # -----------------------------------------------------------------------
      # Codecov is reporting infrastructure, not application correctness.
      #
      # Do not allow a temporary Codecov outage to block merging.
      #
      # Fork PRs do not receive repository secrets, so skip token-authenticated
      # uploads from forks.
      # -----------------------------------------------------------------------

      - name: Upload coverage to Codecov
        if: >-
          ${{
            !cancelled() &&
            (
              github.event_name != 'pull_request' ||
              github.event.pull_request.head.repo.full_name == github.repository
            )
          }}
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unit
          fail_ci_if_error: false


  # ===========================================================================
  # Actual production target
  #
  # This is intentionally NOT just `next build`.
  #
  # Production is:
  #
  #   Next.js
  #       ↓
  #   OpenNext
  #       ↓
  #   Cloudflare Workers
  #
  # Therefore OpenNext must compile successfully before merging.
  # ===========================================================================

  cloudflare-build:
    name: Cloudflare Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Avoid paying for / waiting on an expensive build if basic checks fail.
    needs:
      - quality
      - database
      - unit

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # IMPORTANT:
      #
      # @opennextjs/cloudflare must already exist in package.json + bun.lock.
      #
      # Never do:
      #
      #   bun add @opennextjs/cloudflare
      #
      # inside CI.
      #
      # The build must be reproducible from the committed lockfile.
      - name: Build for Cloudflare Workers
        run: bun run cf:build


  # ===========================================================================
  # Browser / end-to-end tests
  #
  # Run smoke tests against the built Worker, rather than a separate Node.js
  # `next start` process. This exercises the OpenNext/Workers runtime.
  # ===========================================================================

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    needs:
      - cloudflare-build

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_USER: jobprep
          POSTGRES_DB: jobprep
          POSTGRES_HOST_AUTH_METHOD: trust

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U jobprep -d jobprep"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Build and start the Worker preview
        run: |
          cat <<EOF > .dev.vars
          BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
          BETTER_AUTH_URL=${BETTER_AUTH_URL}
          NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
          APP_NAME=${APP_NAME}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          DATABASE_URL=${DATABASE_URL}
          SKIP_ENV_VALIDATION=1
          EOF
          bun run cf:build
          bun run cf:preview -- --port 3000 > "$RUNNER_TEMP/opennext-preview.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/opennext-preview.pid"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/opennext-preview.log"
          exit 1

      - name: Run Playwright tests
        run: bunx playwright test
        env:
          PLAYWRIGHT_NO_SERVER: "true"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Show Worker preview log on failure
        if: ${{ failure() }}
        run: cat "$RUNNER_TEMP/opennext-preview.log"


  # ===========================================================================
  # Python / LiveKit Avatar Agent
  #
  # Treat this as an independent service.
  #
  # Its dependency graph, formatting, lint and tests are checked independently
  # from the Next.js application.
  # ===========================================================================

  python-agent:
    name: Python Agent
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: functions/LiveKit Avatar Agent

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # setup-uv v10.1.0 pinned to its full immutable commit SHA.
      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          working-directory: functions/LiveKit Avatar Agent
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Show uv version
        run: uv --version

      - name: Sync Python dependencies
        run: uv sync --dev --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Run Python tests
        run: uv run pytest -q
