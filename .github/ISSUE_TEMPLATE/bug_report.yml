name: Bug report
description: Report a problem you can reproduce in JobPrep
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Search [existing issues](https://github.com/aliammari1/JobPrep/issues) first. For questions use [Discussions](https://github.com/aliammari1/JobPrep/discussions). For security problems use a [private advisory](https://github.com/aliammari1/JobPrep/security/advisories/new), not this form.

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the page or feature and the actions that trigger the bug.
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Tell us what you expected to happen and what happened instead.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the browser, device, and whether you used the hosted app or a local checkout.
      placeholder: Safari on iPhone, hosted app

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, logs, or a small example
      description: If available, include evidence with API keys, tokens, and personal data removed.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and found no duplicate
          required: true
        - label: I removed API keys, tokens, and personal data from this report
          required: true
        - label: I would like to try fixing this myself
