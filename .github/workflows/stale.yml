name: Stale

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      # actions/stale v9
      - uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security,help wanted,good first issue
          exempt-pr-labels: pinned,security
          stale-issue-message: >
            This issue has had no activity for 60 days. It will close in 14 days
            unless there is new information. Comment to keep it open.
          stale-pr-message: >
            This PR has had no activity for 60 days. It will close in 14 days
            unless you push an update or comment. You are welcome to reopen it later.
