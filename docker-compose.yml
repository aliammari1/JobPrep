# JobPrep local development infrastructure.
#
# Provides the services `next dev` needs that aren't part of the repo:
# PostgreSQL (required — Prisma + Better Auth). Everything else the app
# integrates with (Upstash, Stripe, LiveKit, AI providers) is SaaS/BYOK and
# configured via `.env`, not composed here.
#
# Usage:
#   bun run db:up     # start postgres in the background
#   bun run db:down   # stop it (data persists in the `pgdata` volume)
#   bunx prisma migrate deploy   # apply migrations (first run)
#   bun run dev                  # start the app
#
# Version pins mirror CI (.github/workflows/ci.yml): postgres:16-alpine.

services:
  db:
    image: postgres:16-alpine
    container_name: jobprep-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobprep
      POSTGRES_PASSWORD: jobprep
      POSTGRES_DB: jobprep
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobprep -d jobprep"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Full self-hosted stack: `docker compose --profile app up -d --build`
  # Reads secrets from .env; DATABASE_URL is overridden to reach the db service.
  app:
    profiles: ["app"]
    build: .
    container_name: jobprep-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://jobprep:jobprep@db:5432/jobprep
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    command: ["sh", "-c", "bunx prisma migrate deploy && bun run start"]

volumes:
  pgdata:
